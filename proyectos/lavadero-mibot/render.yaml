services:
  - type: web
    name: lavadero-no-limits-park
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OWNER_PHONE
        value: "+5491158959978"
      - key: ADMIN_SECRET_TOKEN
        value: "nolimits2026secretadmin"
