<!DOCTYPE html>
<html lang="es" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Comunidad T5 - Foro y Encuestas</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ropero EEST5" />
  <link rel="apple-touch-icon" href="imagenes/icon-192.png" />
  <meta name="theme-color" content="#2c53b5" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              orange: 'rgb(232, 125, 53)',
              orangeHover: 'rgb(212, 105, 33)',
              blue: 'rgb(44, 83, 181)',
              blueHover: 'rgb(34, 73, 161)',
            }
          }
        }
      }
    };
    (function() {
      try {
        var theme = localStorage.getItem('app_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <!-- FontAwesome Icons & Custom CSS Modulares -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/custom.css" />
</head>
<body class="min-h-screen flex flex-col bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 text-base overflow-x-hidden w-full transition-colors duration-200">

  <!-- HEADER -->
  <header class="sticky top-0 z-30 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm w-full">
    <div class="max-w-3xl mx-auto px-3 sm:px-4">
      <div class="flex items-center justify-between min-h-[60px] sm:min-h-[64px] py-2 gap-2">
        <a href="index.html" class="flex items-center space-x-2 select-none min-w-0">
          <img src="imagenes/logo.jfif" alt="Logo Escuela" class="w-10 h-10 object-contain rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-0.5 shrink-0" />
          <div class="min-w-0">
            <h1 class="font-black text-slate-900 dark:text-white text-xs sm:text-base tracking-tight leading-none truncate">
              r/ComunidadT5
            </h1>
            <p class="text-[9px] sm:text-xs text-slate-500 dark:text-slate-400 font-medium truncate">Foro Comunitario</p>
          </div>
        </a>

        <div class="flex items-center gap-2 sm:gap-2.5 shrink-0">
          <!-- BOTÓN CAMPANITA DE NOTIFICACIONES -->
          <button id="btnOpenNotifications" aria-label="Notificaciones" class="relative w-11 h-11 min-w-[44px] min-h-[44px] flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 text-base sm:text-lg rounded-xl transition shadow-sm border border-slate-200 dark:border-slate-700 active:scale-95">
            <i class="fa-solid fa-bell"></i>
            <span id="badgeNotifCount" class="hidden absolute -top-1 -right-1 bg-rose-600 text-white text-[10px] font-black px-1.5 py-0.2 rounded-full min-w-[18px] text-center shadow-sm">0</span>
          </button>

          <button id="btnThemeToggle" aria-label="Cambiar tema" class="w-11 h-11 min-w-[44px] min-h-[44px] flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 text-base sm:text-lg rounded-xl transition shadow-sm border border-slate-200 dark:border-slate-700 active:scale-95">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
          </button>

          <!-- SESIÓN EN HEADER DEL FORO -->
          <div id="foroUserSession" class="text-xs"></div>

          <a href="index.html" class="bg-[rgb(44,83,181)] hover:bg-[rgb(34,73,161)] text-white font-black px-3.5 sm:px-4 py-2 min-h-[44px] rounded-xl text-xs sm:text-sm shadow-sm transition flex items-center space-x-1.5 active:scale-95">
            <i class="fa-solid fa-arrow-left text-xs"></i>
            <span>Volver</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-grow max-w-3xl w-full mx-auto px-2.5 sm:px-4 py-3 sm:py-5 space-y-3.5">

    <!-- BOTÓN CREAR POST -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3 sm:p-4 shadow-sm flex items-center space-x-3">
      <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-[rgb(232,125,53)] text-white flex items-center justify-center font-bold shrink-0 text-sm sm:text-base shadow-sm">
        <i class="fa-solid fa-user"></i>
      </div>
      <button id="btnTogglePostForm" class="flex-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700/80 text-slate-600 dark:text-slate-300 text-left text-xs sm:text-base font-bold px-4 py-3 min-h-[48px] rounded-xl transition border border-transparent dark:border-slate-700 truncate">
        Crear publicación o encuesta...
      </button>
    </div>

    <!-- FORMULARIO PUBLICACIÓN Y ENCUESTA -->
    <div id="postFormContainer" class="hidden bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 sm:p-5 shadow-lg space-y-3.5">
      <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-2.5">
        <h3 class="text-xs sm:text-sm font-black uppercase text-slate-600 dark:text-slate-300 tracking-wider">Nueva Publicación</h3>
        <button id="btnClosePostForm" class="text-slate-400 hover:text-slate-600 dark:hover:text-white text-base p-1.5 rounded-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="formComentario" class="space-y-3.5">
        <!-- SELECTOR DE TIPO -->
        <div class="grid grid-cols-2 gap-2.5">
          <button type="button" id="btnTypePost" class="py-3 px-3 text-xs sm:text-sm font-black rounded-xl bg-[rgb(232,125,53)] text-white shadow-sm transition min-h-[46px] flex items-center justify-center space-x-1.5">
            <i class="fa-solid fa-align-left"></i>
            <span>Publicación</span>
          </button>
          <button type="button" id="btnTypePoll" class="py-3 px-3 text-xs sm:text-sm font-black rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 transition min-h-[46px] flex items-center justify-center space-x-1.5">
            <i class="fa-solid fa-square-poll-vertical"></i>
            <span>Encuesta</span>
          </button>
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-400">Categoría</label>
          <select id="categoriaPostSelect" class="w-full px-3.5 py-3 text-xs sm:text-sm font-extrabold bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 dark:text-white rounded-xl focus:outline-none min-h-[46px]">
            <option value="MODA">r/MODA</option>
            <option value="TECNOLOGIA">r/TECNOLOGIA</option>
            <option value="UTILES">r/UTILES</option>
            <option value="AVISOS">r/AVISOS</option>
            <option value="GENERAL">r/GENERAL</option>
            <option value="CUSTOM">+ Crear nueva categoría...</option>
          </select>

          <div id="customCategoryWrapper" class="hidden">
            <input type="text" id="categoriaPostCustom" placeholder="Nombre de categoría propia..."
              class="w-full px-3.5 py-3 text-xs sm:text-sm font-bold uppercase tracking-wider bg-slate-50 dark:bg-slate-800 border border-[rgb(232,125,53)] dark:text-white rounded-xl focus:outline-none min-h-[46px]" />
          </div>
        </div>

        <input type="text" id="tituloPost" required placeholder="Título o Pregunta de la Encuesta *"
          class="w-full px-3.5 py-3 text-sm sm:text-base font-black bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-[rgb(232,125,53)] min-h-[48px]" />

        <textarea id="textoComentario" rows="3" placeholder="Detalles adicionales (Opcional)..."
          class="w-full p-3.5 text-xs sm:text-sm bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 dark:text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-[rgb(232,125,53)] font-medium min-h-[90px]"></textarea>

        <!-- OPCIONES DE ENCUESTA -->
        <div id="pollFieldsWrapper" class="hidden space-y-2.5 border-t border-b border-slate-100 dark:border-slate-800 py-3.5">
          <label class="block text-xs font-black text-[rgb(232,125,53)] uppercase tracking-wider">Opciones de la Encuesta</label>
          <div id="pollOptionsContainer" class="space-y-2">
            <input type="text" class="poll-option-input w-full px-3.5 py-2.5 text-xs sm:text-sm font-bold bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 dark:text-white rounded-xl focus:outline-none min-h-[44px]" placeholder="Opción 1" />
            <input type="text" class="poll-option-input w-full px-3.5 py-2.5 text-xs sm:text-sm font-bold bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 dark:text-white rounded-xl focus:outline-none min-h-[44px]" placeholder="Opción 2" />
          </div>
          <button type="button" id="btnAddPollOption" class="text-xs sm:text-sm font-extrabold text-[rgb(44,83,181)] dark:text-blue-400 hover:underline flex items-center space-x-1.5 pt-1 min-h-[38px]">
            <i class="fa-solid fa-plus text-xs"></i>
            <span>Añadir otra opción</span>
          </button>
        </div>

        <!-- IMAGEN -->
        <div id="postImageSection" class="space-y-2">
          <div class="flex items-center justify-between">
            <label class="block text-xs font-bold text-slate-600 dark:text-slate-400">Adjuntar Imágenes (Podés agregar más de 1)</label>
            <span id="postImageCountBadge" class="hidden text-[10px] font-black text-[rgb(232,125,53)] bg-orange-500/10 px-2 py-0.5 rounded-full">0 fotos</span>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <label class="flex items-center justify-center space-x-2 bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 py-3 px-3 rounded-xl cursor-pointer text-xs sm:text-sm font-extrabold text-slate-700 dark:text-slate-200 transition min-h-[48px]">
              <i class="fa-solid fa-camera text-[rgb(232,125,53)] text-sm"></i>
              <span>Tomar Foto</span>
              <input type="file" id="postCameraInput" accept="image/*" capture="environment" class="hidden" />
            </label>

            <label class="flex items-center justify-center space-x-2 bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 py-3 px-3 rounded-xl cursor-pointer text-xs sm:text-sm font-extrabold text-slate-700 dark:text-slate-200 transition min-h-[48px]">
              <i class="fa-solid fa-folder-open text-[rgb(44,83,181)] text-sm"></i>
              <span>Galería (Múltiples)</span>
              <input type="file" id="postFileInput" accept="image/*" multiple class="hidden" />
            </label>
          </div>

          <div id="postPreviewContainer" class="hidden space-y-1.5 pt-1">
            <div id="postThumbnailsGrid" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto p-1 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-200 dark:border-slate-700"></div>
          </div>

          <input type="hidden" id="postImage" value="" />
        </div>

        <div class="flex justify-end space-x-2.5 pt-2.5 border-t border-slate-100 dark:border-slate-800">
          <button type="button" id="btnCancelPostForm" class="px-4 py-2.5 text-xs sm:text-sm text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 font-bold min-h-[44px]">Cancelar</button>
          <button type="submit" class="bg-[rgb(232,125,53)] hover:bg-[rgb(212,105,33)] text-white font-black px-5 py-2.5 rounded-xl text-xs sm:text-sm shadow-md transition min-h-[44px] flex items-center space-x-1.5">
            <i class="fa-solid fa-paper-plane text-xs"></i>
            <span>Publicar</span>
          </button>
        </div>
      </form>
    </div>

    <!-- FILTROS Y CATEGORÍAS -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3 sm:p-3.5 shadow-sm space-y-2.5">
      <div id="categoryFilterBar" class="flex items-center space-x-2 overflow-x-auto pb-1 no-scrollbar text-xs sm:text-sm font-black"></div>

      <div class="flex items-center justify-between border-t border-slate-100 dark:border-slate-800 pt-2.5 text-xs sm:text-sm font-bold">
        <span class="text-slate-400 text-xs uppercase tracking-wider">Ordenar:</span>
        <div class="flex items-center space-x-2">
          <button id="filterTop" class="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-[rgb(232,125,53)] font-extrabold flex items-center space-x-1.5 text-xs sm:text-sm min-h-[38px] transition">
            <i class="fa-solid fa-fire text-xs"></i>
            <span>Top</span>
          </button>
          <button id="filterNew" class="px-3.5 py-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center space-x-1.5 text-xs sm:text-sm min-h-[38px] transition">
            <i class="fa-solid fa-clock text-xs"></i>
            <span>Recientes</span>
          </button>
        </div>
      </div>
    </div>

    <!-- FEED DE PUBLICACIONES -->
    <div id="listaComentarios" class="space-y-3.5"></div>

  </main>

  <!-- MODAL VISOR TIPO ZOOM (COMPACTO Y MODERNO) -->
  <div id="modalImageZoom" class="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm hidden items-center justify-center p-3 select-none">
    <div class="relative bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl max-w-sm sm:max-w-md w-full overflow-hidden flex flex-col transition-all duration-200" id="zoomModalCard">
      
      <!-- HEADER CON CONTADOR Y ZOOM -->
      <div class="flex items-center justify-between px-3.5 py-2.5 border-b border-slate-100 dark:border-slate-800 bg-slate-50/80 dark:bg-slate-800/80 shrink-0">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-magnifying-glass text-[rgb(232,125,53)] text-xs"></i>
          <span id="zoomCounter" class="text-xs font-black text-slate-700 dark:text-slate-200">1 / 1</span>
        </div>
        <div class="flex items-center space-x-2">
          <button id="btnToggleZoomScale" type="button" class="text-xs font-black px-2.5 py-1 rounded-lg bg-slate-200/70 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-[rgb(232,125,53)] hover:text-white transition flex items-center space-x-1">
            <i class="fa-solid fa-magnifying-glass-plus text-[10px]"></i>
            <span id="zoomScaleText">Zoom 2x</span>
          </button>
          <button id="btnCloseZoomViewer" type="button" class="text-slate-400 hover:text-slate-600 dark:hover:text-white p-1 rounded-lg">
            <i class="fa-solid fa-xmark text-sm"></i>
          </button>
        </div>
      </div>

      <!-- ÁREA DE LA IMAGEN CON ZOOM INTERACTIVO -->
      <div id="zoomImageWrapper" class="relative overflow-hidden w-full h-72 sm:h-80 bg-slate-950 flex items-center justify-center cursor-zoom-in">
        <img id="zoomTargetImage" src="" alt="Vista previa con zoom" class="max-w-full max-h-full object-contain transition-transform duration-200" />
        
        <!-- BOTONES DE NAVEGACIÓN ANTERIOR / SIGUIENTE -->
        <button id="btnZoomPrev" type="button" class="hidden absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-slate-900/80 hover:bg-slate-900 text-white flex items-center justify-center shadow-lg transition active:scale-90">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <button id="btnZoomNext" type="button" class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full bg-slate-900/80 hover:bg-slate-900 text-white flex items-center justify-center shadow-lg transition active:scale-90">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>

      <!-- FOOTER INDICADOR DE PUNTOS O MINIATURAS -->
      <div id="zoomDotsContainer" class="hidden flex items-center justify-center space-x-1.5 py-2 px-3 border-t border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 shrink-0"></div>
    </div>
  </div>

  <!-- MODAL NOTIFICACIONES (AVISOS FORO Y RESERVAS) -->
  <div id="modalNotifications" class="modal-container fixed inset-0 z-50 bg-slate-950/85 modal-overlay hidden items-center justify-center p-3">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 sm:p-5 max-w-md w-full shadow-2xl space-y-3.5 max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-2.5 shrink-0">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-bell text-[rgb(232,125,53)] text-sm"></i>
          <h3 class="font-black text-xs sm:text-sm uppercase tracking-wider text-slate-700 dark:text-slate-300">Notificaciones</h3>
        </div>
        <div class="flex items-center space-x-2">
          <button id="btnMarkAllNotifsRead" class="text-[11px] font-bold text-[rgb(44,83,181)] dark:text-blue-400 hover:underline">
            Marcar leídas
          </button>
          <button class="btn-close-modal text-slate-400 hover:text-slate-600 dark:hover:text-white p-1">
            <i class="fa-solid fa-xmark text-base"></i>
          </button>
        </div>
      </div>

      <div id="notificationsListContainer" class="flex-grow overflow-y-auto space-y-2 pr-1 min-h-[180px]">
      </div>
    </div>
  </div>

  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <script type="module" src="js/foro.js?v=4.0"></script>
<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(function(reg) {
            console.log('PWA Service Worker activo:', reg.scope);
          })
          .catch(function(err) {
            console.warn('Error al registrar Service Worker:', err);
          });
      });
    }
  </script>
</body>
</html>
